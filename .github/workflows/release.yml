name: Build and publish installers

on:
  push:
    tags:
      - v2.0.0

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.platform }} desktop installers
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
          - platform: win
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Windows installers
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          RELEASE_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          RELEASE_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:RELEASE_CSC_LINK) {
            $env:CSC_LINK = $env:RELEASE_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:RELEASE_CSC_KEY_PASSWORD
          }
          npm run package:win
      - name: Build macOS installers
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          RELEASE_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          RELEASE_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          RELEASE_APPLE_ID: ${{ secrets.APPLE_ID }}
          RELEASE_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RELEASE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$RELEASE_CSC_LINK" ]; then
            CSC_LINK="$RELEASE_CSC_LINK" \
            CSC_KEY_PASSWORD="$RELEASE_CSC_KEY_PASSWORD" \
            APPLE_ID="$RELEASE_APPLE_ID" \
            APPLE_APP_SPECIFIC_PASSWORD="$RELEASE_APPLE_APP_SPECIFIC_PASSWORD" \
            APPLE_TEAM_ID="$RELEASE_APPLE_TEAM_ID" \
              npm run package:mac
          else
            npm run package:mac
          fi
      - name: Build Linux installers
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npm run package:linux
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*
            !apps/desktop/release/*.blockmap
          if-no-files-found: error

  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/statuser-release.jks"
      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/statuser-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name Android installer
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Statuser-2.0.0-android.apk"
      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/Statuser-2.0.0-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Statuser 2.0.0
          generate_release_notes: true
          prerelease: false
          files: installers/*
