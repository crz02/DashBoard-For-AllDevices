name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/landing.html"
      - "public/landing.css"
      - "public/landing.js"
      - "public/setup.html"
      - "public/setup.css"
      - "public/setup.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir site
          cp public/landing.html site/index.html
          cp public/landing.css site/landing.css
          cp public/landing.js site/landing.js
          cp public/setup.html site/setup.html
          cp public/setup.css site/setup.css
          cp public/setup.js site/setup.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
